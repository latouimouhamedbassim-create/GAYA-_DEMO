<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaya Immobilier – Constantine</title>
<meta name="description" content="Agence immobilière Gaya, Zouaghi, Constantine : appartements et locaux à vendre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F3F1; --surface:#FFFFFF; --surface2:#ECECE8; --ink:#1C1B1A; --muted:#66625E; --line:#DEDCD7;
  --char:#2A2827; --char-ink:#F6F4F1; --red:#C4352B; --red-ink:#FFFFFF; --gold:#E8A33A; --gold-soft:#FBEBD2;
  --wa:#1E9E52; --shadow:0 18px 50px -22px rgba(30,20,10,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121110; --surface:#1B1A19; --surface2:#24221F; --ink:#EEEBE6; --muted:#A39E97; --line:#33302C;
    --char:#0B0A0A; --char-ink:#F6F4F1; --red:#E0574A; --red-ink:#FFFFFF; --gold:#EEB45A; --gold-soft:#3A2C17;
    --wa:#2BB765; --shadow:0 18px 50px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121110; --surface:#1B1A19; --surface2:#24221F; --ink:#EEEBE6; --muted:#A39E97; --line:#33302C;
  --char:#0B0A0A; --char-ink:#F6F4F1; --red:#E0574A; --red-ink:#FFFFFF; --gold:#EEB45A; --gold-soft:#3A2C17;
  --wa:#2BB765; --shadow:0 18px 50px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--char)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
[dir="ltr"]{unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.disp{font-family:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--char);color:var(--char-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logo .mk{font-family:"Alexandria",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;background:linear-gradient(90deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.logo small{display:block;font-size:11px;opacity:.7;line-height:1.2}
.nav{display:none;gap:4px;margin-inline-start:auto}
.nav a{color:var(--char-ink);text-decoration:none;font-size:15px;padding:8px 12px;border-radius:8px;opacity:.85}
.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.tools{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
@media (min-width:860px){.nav{display:flex}.tools{margin-inline-start:12px}}
.lang{height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--char-ink);cursor:pointer;font-weight:600;font-size:14px}
.callTop{display:none;height:38px;padding:0 16px;border-radius:999px;background:var(--red);color:var(--red-ink);text-decoration:none;align-items:center;gap:8px;font-weight:600;font-size:14px}
@media (min-width:600px){.callTop{display:inline-flex}}
.callTop svg{width:16px;height:16px}
.demo{background:var(--gold-soft);color:var(--ink);font-size:13px;text-align:center;padding:6px 16px}

/* Hero */
.hero{padding:28px 0 8px}
.hero .wrap{display:grid;gap:24px}
@media (min-width:900px){.hero{padding:56px 0 24px}.hero .wrap{grid-template-columns:1fr 1.05fr;align-items:center;gap:56px}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:12px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.hero h1{font-size:clamp(32px,5.4vw,58px);line-height:1.12;margin:0 0 16px;font-weight:700;letter-spacing:-.015em;max-width:14ch}
[dir="rtl"] .hero h1{line-height:1.35;letter-spacing:0;font-size:clamp(30px,4.4vw,50px)}
@media (max-width:899px){.heroPic{order:-1;aspect-ratio:16/11}}
.hero .lead{color:var(--muted);font-size:17px;max-width:44ch;margin:0 0 24px}
.search{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
@media (min-width:600px){.search{grid-template-columns:1fr 1fr auto;align-items:end}}
.search label,.form label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=tel],input[type=number],input[type=date]{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select{background-position:18px 52%,13px 52%}
select:focus,input:focus{border-color:var(--gold);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.dark{background:var(--char);color:var(--char-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.full{width:100%}
.btn:active{transform:translateY(1px)}

.heroPic{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:var(--surface2);box-shadow:var(--shadow);cursor:pointer;border:none;padding:0;display:block;width:100%}
@media (min-width:900px){.heroPic{aspect-ratio:5/4}}
.heroPic img{width:100%;height:100%;object-fit:cover}
.sign{position:absolute;inset-inline-start:16px;bottom:16px;background:var(--char);color:var(--char-ink);border-radius:14px;padding:12px 16px;text-align:start;max-width:calc(100% - 32px);border-top:4px solid var(--red)}
.sign b{display:block;font-family:"Alexandria",sans-serif;font-size:18px;font-weight:600}
.sign span{font-size:13px;opacity:.8}
.sign em{position:absolute;top:-14px;inset-inline-end:12px;background:var(--gold);color:#2A1A05;font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}

/* Listings */
section{padding:48px 0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
h2{font-size:clamp(26px,3.4vw,36px);line-height:1.2;margin:0;font-weight:600}
.head p{margin:6px 0 0;color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.f[aria-pressed="true"]{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow)}
@media (prefers-reduced-motion: no-preference){.card:hover{transform:translateY(-2px)}}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface2);border:none;padding:0;cursor:pointer;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:var(--red-ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.count{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(20,18,16,.72);color:#fff;font-size:12px;padding:4px 9px;border-radius:999px;display:flex;gap:5px;align-items:center}
.count svg{width:13px;height:13px}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:19px;font-weight:600;line-height:1.3}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.loc svg{width:15px;height:15px;flex:none;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface2);color:var(--ink)}
.chip.gold{background:var(--gold-soft)}
.hl{font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.hl svg{width:16px;height:16px;flex:none;color:var(--gold);margin-top:3px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.price{font-weight:600;font-size:15px}
.price small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.foot .acts{display:flex;gap:8px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);background:transparent;color:var(--wa);text-decoration:none;flex:none}
.icon svg{width:20px;height:20px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:20px}

/* Sell */
.sell{background:var(--char);color:var(--char-ink);border-radius:28px;padding:28px 22px;display:grid;gap:24px}
@media (min-width:900px){.sell{grid-template-columns:1fr 1.1fr;padding:48px;gap:48px;align-items:center}}
.sell h2{color:var(--char-ink)}
.sell p{opacity:.8;margin:10px 0 0;max-width:42ch}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:15px}
.steps b{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2A1A05;display:grid;place-items:center;font-size:13px;flex:none}
.sell .form{background:var(--surface);color:var(--ink);border-radius:20px;padding:18px}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--red);font-size:14px;min-height:0}
.ok{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--wa)}

/* Contact */
.contact{display:grid;gap:18px}
@media (min-width:860px){.contact{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:8px;align-content:start}
.box svg{width:24px;height:24px;color:var(--red)}
.box h3{margin:4px 0 0;font-size:17px;font-weight:600}
.box p{margin:0;color:var(--muted)}
.box a{color:var(--ink);font-weight:600;text-decoration:none}
.box .btn{margin-top:8px;justify-self:start}

footer{padding:28px 0 110px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:860px){footer{padding-bottom:32px}}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* Mobile action bar */
.bar{position:fixed;inset:auto 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:860px){.bar{display:none}}

/* Detail sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,8,6,.6);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--surface);width:100%;max-height:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:860px){
  .ov{align-items:center;padding:32px}
  .sheet{height:auto;max-height:calc(100vh - 64px);max-width:1040px;border-radius:24px;display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden;padding-top:0}
  .sheet .info{overflow-y:auto;max-height:calc(100vh - 64px)}
}
@media (prefers-reduced-motion: no-preference){.ov.on .sheet{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:none;background:rgba(20,18,16,.7);color:#fff;cursor:pointer;display:grid;place-items:center}
@media (min-width:860px){.close{top:12px}}
.close svg{width:20px;height:20px}
.gal{position:relative;background:#111}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(62vh,520px)}
@media (min-width:860px){.slides{height:100%;min-height:560px}}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#fff;width:22px;border-radius:4px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:#1C1B1A;cursor:pointer;display:none;place-items:center}
.arrow svg{width:20px;height:20px}
@media (hover:hover){.arrow{display:grid}}
.arrow.prev{inset-inline-start:12px}.arrow.next{inset-inline-end:12px}
.info{padding:22px 20px 120px;display:grid;gap:16px;align-content:start}
@media (min-width:860px){.info{padding:32px 32px 28px}}
.info h2{font-size:clamp(24px,3vw,30px)}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.spec div{background:var(--surface2);border-radius:14px;padding:12px}
.spec span{display:block;font-size:12px;color:var(--muted)}
.spec b{font-size:16px;font-weight:600}
.feats{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.feats li{display:flex;gap:10px;align-items:flex-start}
.feats svg{width:18px;height:18px;color:var(--wa);flex:none;margin-top:3px}
.visit{background:var(--surface2);border-radius:18px;padding:16px;display:grid;gap:12px}
.visit h3{margin:0;font-size:17px;font-weight:600}
.sticky{position:fixed;inset:auto 0 0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:860px){.sticky{position:static;padding:0;border:none;background:transparent}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Gaya Immobilier"><span class="mk">GAYA</span><span><small data-t="agency"></small></span></a>
    <nav class="nav" aria-label="Menu">
      <a href="#biens" data-t="navBiens"></a><a href="#vendre" data-t="navSell"></a><a href="#contact" data-t="navContact"></a>
    </nav>
    <div class="tools">
      <a class="callTop" href="tel:0793899391"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span dir="ltr">0793 89 93 91</span></a>
      <button class="lang" id="langBtn" type="button"></button>
    </div>
  </div>
</header>
<div class="demo" data-t="demo"></div>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div>
        <div class="kicker"><i></i><span data-t="kicker"></span></div>
        <h1 class="disp" data-t="h1"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="search" role="search">
          <label><span data-t="sType"></span><select id="qType"></select></label>
          <label><span data-t="sZone"></span><select id="qZone"></select></label>
          <button class="btn red" id="qGo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-t="sGo"></span></button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <button class="heroPic" id="heroPic" type="button"></button>
    </div>
  </div>

  <section id="biens">
    <div class="wrap">
      <div class="head">
        <div><h2 class="disp" data-t="listTitle"></h2><p id="resCount"></p></div>
        <div class="filters" id="filters" role="group"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="vendre">
    <div class="wrap">
      <div class="sell">
        <div>
          <h2 class="disp" data-t="sellTitle"></h2>
          <p data-t="sellLead"></p>
          <ol class="steps" id="steps"></ol>
        </div>
        <div class="form" id="sellForm"></div>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="head"><div><h2 class="disp" data-t="contactTitle"></h2></div></div>
      <div class="contact" id="contactBoxes"></div>
    </div>
  </section>
</main>

<footer><div class="wrap"><span data-t="copy"></span><span data-t="credit"></span></div></footer>

<div class="bar" id="bar"></div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){

    days:["في أقرب وقت","السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],
    send:"ابعث في واتساب", call:"اتصل", missing:"اكتب الاسم ورقم الهاتف.",
    waVisit:"السلام عليكم Gaya، نحب نزور هاذ العقار:\n{title} – {loc} ({surface} م²)\nاليوم: {day}\nالاسم: {name}\nالهاتف: {phone}",
    waInfo:"السلام عليكم Gaya، يهمني: {title} – {loc} ({surface} م²). نحب معلومات أكثر من فضلكم.",
    sellTitle:"عندك عقار تحب تبيعو؟", sellLead:"خليه عند Gaya: نعرضوه على المشترين تاعنا ونرافقوك حتى الإمضاء.",
    steps:["وصف العقار في دقيقة","الوكالة تعاود تعيطلك","الزيارة والعرض للبيع"],
    sKind:"النوع", sKinds:["شقة","فيلا ولا طابق فيلا","محل تجاري","أرض"], sArea:"الحي", sSurf:"المساحة (م²)",
    sellSend:"ابعث الطلب", sellOk:"الطلب واجد: واتساب يتحل باش تبعثو للوكالة.",
    waSell:"السلام عليكم Gaya، نحب نبيع عقار:\nالنوع: {kind}\nالحي: {area}\nالمساحة: {surf} م²\nالاسم: {name}\nالهاتف: {phone}",
    contactTitle:"زورونا",
    cAddrT:"العنوان", cAddr:"حي 250 مسكن، عمارة 14، زواغي، قسنطينة", cMap:"افتح في الخريطة",
    cHoursT:"أوقات العمل", cHours:"من 9:00 حتى 18:00", cHoursNote:"الرجاء احترام أوقات العمل.",
    cPhoneT:"الهاتف",
    copy:"© الوكالة العقارية Gaya، قسنطينة", credit:"موقع تجريبي من إعداد محمد بسام"}
};
T.fr.stats[2][1]="horaires de l’agence";

let lang = "ar";
let fType = "all", fZone = "all";
const $ = s => document.querySelector(s);
function h(tag, attrs, kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(k==="text") e.textContent = v;
    else if(k==="html") e.innerHTML = v;
    else if(k==="on") e.addEventListener("click", v);
    else if(v!==false && v!=null) e.setAttribute(k, v);
  }
  (kids||[]).forEach(c => { if(c!=null) e.append(c); });
  return e;
}
function ic(n){ return h("span",{html:SVG[n],"aria-hidden":"true",style:"display:contents"}); }
function tpl(s,o){ return s.replace(/\{(\w+)\}/g,(m,k)=> o[k]!=null?o[k]:""); }
function waLink(text){ return "https://wa.me/"+WA+"?text="+encodeURIComponent(text); }

function fillSelect(sel, opts, val){ sel.innerHTML=""; opts.forEach(([v,l])=>{ const o=h("option",{value:v,text:l}); if(v===val) o.selected=true; sel.append(o); }); }

function renderHero(){
  const L = T[lang], p = LIST[0], d = p[lang];
  const hp = $("#heroPic"); hp.innerHTML="";
  hp.setAttribute("aria-label", L.see+" : "+d.title);
  hp.append(h("img",{src:IMG[p.imgs[0]], alt:d.title+", "+d.loc}),
    h("span",{class:"sign"},[h("em",{text:L.featured}), h("b",{text:d.title}), h("span",null,[h("bdi",{text:p.surface+" "+L.m2}), " – "+d.loc])]));
  hp.onclick = ()=>openDetail(p.id);
  const st = $("#stats"); st.innerHTML="";
  L.stats.forEach(([a,b])=> st.append(h("span",null,[h("b",{text:a})," ",b])));
}

function renderFilters(){
  const L = T[lang], wrap = $("#filters"); wrap.innerHTML="";
  wrap.setAttribute("aria-label", L.sType);
  L.types.forEach(([v,l])=> wrap.append(h("button",{type:"button", class:"f", "aria-pressed":String(fType===v), text:l, on:()=>{ fType=v; $("#qType").value=v; renderFilters(); renderGrid(); }})));
}

function renderGrid(){
  const L = T[lang], grid = $("#grid"); grid.innerHTML="";
  const items = LIST.filter(p => (fType==="all"||p.type===fType) && (fZone==="all"||p.zone===fZone));
  $("#resCount").textContent = tpl(L.res,{n:items.length});
  if(!items.length){ grid.append(h("div",{class:"empty", text:L.none})); return; }
  items.forEach(p=>{
    const d = p[lang];
    const chips = [h("span",{class:"chip", text:p.surface+" "+L.m2, dir:"auto"})];
    if(p.rooms) chips.push(h("span",{class:"chip", text:p.rooms+" "+L.rooms}));
    chips.push(h("span",{class:"chip", text:d.floor}));
    chips.push(h("span",{class:"chip gold", text:d.papers}));
    grid.append(h("article",{class:"card"},[
      h("button",{type:"button", class:"ph", "aria-label":L.see+" : "+d.title, on:()=>openDetail(p.id)},[
        h("img",{src:IMG[p.imgs[0]], alt:d.title+", "+d.loc, loading:"lazy"}),
        h("span",{class:"badge", text:L.sale}),
        h("span",{class:"count"},[ic("cam"), tpl(L.photos,{n:p.imgs.length})])
      ]),
      h("div",{class:"body"},[
        h("h3",{class:"disp", text:d.title}),
        h("div",{class:"loc"},[ic("pin"), d.loc]),
        h("div",{class:"chips"},chips),
        h("div",{class:"hl"},[ic("star"), d.hl]),
        h("div",{class:"foot"},[
          h("div",{class:"price"},[L.price, h("small",{text:L.priceSub})]),
          h("div",{class:"acts"},[
            h("a",{class:"icon", href:waLink(tpl(L.waInfo,{title:d.title,loc:d.loc,surface:p.surface})), target:"_blank", rel:"noopener", "aria-label":"WhatsApp"},[ic("wa")]),
            h("button",{type:"button", class:"btn dark", text:L.see, on:()=>openDetail(p.id)})
          ])
        ])
      ])
    ]));
  });
}

/* Detail */
let lastFocus = null;
function openDetail(id){
  const p = LIST.find(x=>x.id===id); if(!p) return;
  const L = T[lang], d = p[lang];
  lastFocus = document.activeElement;
  const sheet = $("#sheet"); sheet.innerHTML="";
  const slides = h("div",{class:"slides", tabindex:"0", "aria-label":tpl(L.photos,{n:p.imgs.length})});
  p.imgs.forEach((k,i)=> slides.append(h("img",{src:IMG[k], alt:d.title+" "+(i+1)+"/"+p.imgs.length})));
  const dots = h("div",{class:"dots"});
  p.imgs.forEach((k,i)=> dots.append(h("button",{type:"button","aria-label":String(i+1), "aria-current":String(i===0), on:()=>go(i)})));
  function cur(){ return Math.round(Math.abs(slides.scrollLeft)/slides.clientWidth); }
  function go(i){ i=Math.max(0,Math.min(p.imgs.length-1,i)); const x=i*slides.clientWidth; slides.scrollTo({left:x, behavior:"smooth"}); }
  slides.addEventListener("scroll",()=>{ const c=cur(); [...dots.children].forEach((b,i)=>b.setAttribute("aria-current",String(i===c))); },{passive:true});
  const gal = h("div",{class:"gal", dir:"ltr"},[slides, dots,
    p.imgs.length>1 ? h("button",{type:"button", class:"arrow prev", "aria-label":"‹", html:SVG.chevL, on:()=>go(cur()-1)}) : null,
    p.imgs.length>1 ? h("button",{type:"button", class:"arrow next", "aria-label":"›", html:SVG.chev, on:()=>go(cur()+1)}) : null]);

  const spec = h("div",{class:"spec"},[
    h("div",null,[h("span",{text:L.dSurface}), h("b",{text:p.surface+" "+L.m2})]),
    h("div",null,[h("span",{text:L.dFloor}), h("b",{text:d.floor})]),
    h("div",null,[h("span",{text:L.dPapers}), h("b",{text:d.papers})]),
    p.rooms ? h("div",null,[h("span",{text:L.dRooms}), h("b",{text:String(p.rooms)})]) : h("div",null,[h("span",{text:L.sType}), h("b",{text:d.title})])
  ]);
  const nm = h("input",{type:"text", autocomplete:"name", id:"vName"});
  const ph = h("input",{type:"tel", autocomplete:"tel", inputmode:"tel", id:"vPhone", placeholder:"05 / 06 / 07…"});
  const day = h("select",{id:"vDay"}); fillSelect(day, L.days.map(x=>[x,x]), L.days[0]);
  const err = h("div",{class:"err", role:"alert"});
  const sendVisit = ()=>{
    if(!nm.value.trim()||!ph.value.trim()){ err.textContent=L.missing; (nm.value.trim()?ph:nm).focus(); return; }
    err.textContent="";
    window.open(waLink(tpl(L.waVisit,{title:d.title,loc:d.loc,surface:p.surface,day:day.value,name:nm.value.trim(),phone:ph.value.trim()})),"_blank","noopener");
  };
  const info = h("div",{class:"info"},[
    h("div",null,[h("span",{class:"chip gold", text:L.sale}), h("h2",{class:"disp", id:"dTitle", style:"margin-top:10px", text:d.title}), h("div",{class:"loc", style:"margin-top:6px"},[ic("pin"), d.loc])]),
    h("div",{class:"price", style:"font-size:18px"},[L.price, h("small",{text:L.priceSub})]),
    spec,
    h("div",null,[h("h3",{style:"margin:0 0 10px;font-size:17px;font-weight:600", text:L.dFeats}), h("ul",{class:"feats"}, d.feats.map(f=>h("li",null,[ic("check"), f])))]),
    h("div",{class:"visit"},[
      h("h3",{text:L.visitT}),
      h("div",{class:"form"},[
        h("div",{class:"row2"},[h("label",{for:"vName"},[L.name, nm]), h("label",{for:"vPhone"},[L.phone, ph])]),
        h("label",{for:"vDay"},[L.day, day]),
        err
      ])
    ]),
    h("div",{class:"sticky"},[
      h("a",{class:"btn ghost", href:"tel:0793899391"},[ic("phone"), L.call]),
      h("button",{type:"button", class:"btn wa", on:sendVisit},[ic("wa"), L.send])
    ])
  ]);
  sheet.append(h("button",{type:"button", class:"close", "aria-label":"×", html:SVG.x, on:closeDetail}), gal, info);
  $("#ov").classList.add("on"); document.body.classList.add("lock");
  sheet.scrollTop = 0;
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
  setTimeout(()=>sheet.querySelector(".close").focus(),30);
}
function closeDetail(){
  $("#ov").classList.remove("on"); document.body.classList.remove("lock");
  if(LIST.some(p=>"#"+p.id===location.hash)) history.replaceState(null,"",location.pathname+location.search);
  if(lastFocus) lastFocus.focus();
}
$("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeDetail(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#ov").classList.contains("on")) closeDetail(); });

/* Sell form */
function renderSell(){
  const L = T[lang];
  const st = $("#steps"); st.innerHTML="";
  L.steps.forEach((s,i)=> st.append(h("li",null,[h("b",{text:String(i+1)}), s])));
  const f = $("#sellForm"); f.innerHTML="";
  const kind = h("select",{id:"sKind"}); fillSelect(kind, L.sKinds.map(x=>[x,x]), L.sKinds[0]);
  const area = h("input",{type:"text", id:"sArea"});
  const surf = h("input",{type:"number", id:"sSurf", inputmode:"numeric", min:"1"});
  const nm = h("input",{type:"text", id:"sName", autocomplete:"name"});
  const ph = h("input",{type:"tel", id:"sPhone", autocomplete:"tel", inputmode:"tel", placeholder:"05 / 06 / 07…"});
  const err = h("div",{class:"err", role:"alert"});
  f.append(
    h("label",{for:"sKind"},[L.sKind,kind]),
    h("div",{class:"row2"},[h("label",{for:"sArea"},[L.sArea,area]), h("label",{for:"sSurf"},[L.sSurf,surf])]),
    h("div",{class:"row2"},[h("label",{for:"sName"},[L.name,nm]), h("label",{for:"sPhone"},[L.phone,ph])]),
    err,
    h("button",{type:"button", class:"btn red full", on:()=>{
      if(!nm.value.trim()||!ph.value.trim()){ err.className="err"; err.textContent=L.missing; return; }
      err.className="ok"; err.textContent="✓ "+L.sellOk;
      window.open(waLink(tpl(L.waSell,{kind:kind.value, area:area.value.trim()||"–", surf:surf.value||"–", name:nm.value.trim(), phone:ph.value.trim()})),"_blank","noopener");
    }},[ic("wa"), L.sellSend])
  );
}

function renderContact(){
  const L = T[lang], c = $("#contactBoxes"); c.innerHTML="";
  c.append(
    h("div",{class:"box"},[ic("pin"), h("h3",{text:L.cAddrT}), h("p",{text:L.cAddr}),
      h("a",{class:"btn ghost", href:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("Cité 250 logements Zouaghi Constantine"), target:"_blank", rel:"noopener", text:L.cMap})]),
    h("div",{class:"box"},[ic("clock"), h("h3",{text:L.cHoursT}), h("p",{text:L.cHours}), h("p",{style:"font-size:14px", text:L.cHoursNote})]),
    h("div",{class:"box"},[ic("phone"), h("h3",{text:L.cPhoneT}),
      h("p",null,[h("a",{href:"tel:0793899391", dir:"ltr", text:"0793 89 93 91"})]),
      h("p",null,[h("a",{href:"tel:0658491011", dir:"ltr", text:"0658 49 10 11"})]),
      h("a",{class:"btn wa", href:waLink(lang==="ar"?"السلام عليكم Gaya، نحب معلومات من فضلكم.":"Bonjour Gaya Immobilier, je souhaite des informations."), target:"_blank", rel:"noopener"},[ic("wa"),"WhatsApp"])])
  );
  const bar = $("#bar"); bar.innerHTML="";
  bar.append(h("a",{class:"btn ghost", href:"tel:0793899391"},[ic("phone"), L.call]),
    h("a",{class:"btn wa", href:waLink(lang==="ar"?"السلام عليكم Gaya، نحب معلومات من فضلكم.":"Bonjour Gaya Immobilier, je souhaite des informations."), target:"_blank", rel:"noopener"},[ic("wa"),"WhatsApp"]));
}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = L[el.dataset.t]; });
  $("#langBtn").textContent = L.btn;
  fillSelect($("#qType"), L.types, fType);
  fillSelect($("#qZone"), L.zones, fZone);
  renderHero(); renderFilters(); renderGrid(); renderSell(); renderContact();
}
$("#qGo").addEventListener("click", ()=>{ fType=$("#qType").value; fZone=$("#qZone").value; renderFilters(); renderGrid(); document.getElementById("biens").scrollIntoView(); });
$("#langBtn").addEventListener("click", ()=>{
  const open = $("#ov").classList.contains("on") ? location.hash.slice(1) : null;
  lang = lang==="ar" ? "fr" : "ar"; render();
  if(open) openDetail(open);
});
render();
const hid = location.hash.slice(1);
if(LIST.some(p=>p.id===hid)) openDetail(hid);
})();
</script>
